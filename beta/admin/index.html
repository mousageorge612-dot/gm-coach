<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التجريبي | GM Coach</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GM لوحة BETA">
<link rel="icon" href="../../assets/img/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/styles.css?v=3">
<style>
.wrap{padding-bottom:calc(30px + var(--safe-bottom))}
.betatag{background:var(--gold);color:#000;font-weight:900;font-size:11px;border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 16px;background:var(--surface)}
.nav a.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}.kpi b{font-size:24px;display:block;font-weight:900}.kpi span{font-size:12.5px;color:var(--muted)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.ev .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ev .who{font-weight:900}.ev .when{font-size:12px;color:var(--muted)}
.ev .what{margin-top:4px;font-size:14px}.ev .det{margin-top:4px;font-size:13px;color:var(--muted);white-space:pre-line}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;margin-inline-end:6px}
.t-off{background:#3a2a10;color:#ffb800}.t-wk{background:#10283a;color:#6cc4ff}.t-pp{background:#2a1838;color:#c79bff}.t-sw{background:#1f2a1a;color:#8fd46a}.t-pr{background:#3a3210;color:#ffd84a}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.filters button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}table.t th{color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="spinner"></div></div>
<script src="../../assets/core.js?v=2"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
