<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم | GM Coach</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GM لوحة">
<link rel="icon" href="../assets/img/icon-192.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/styles.css?v=2">
<style>
.wrap{padding-bottom:calc(30px + var(--safe-bottom))}
.nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 16px;background:var(--surface)}
.nav a.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}.kpi b{font-size:24px;display:block;font-weight:900}.kpi span{font-size:12.5px;color:var(--muted)}
.cl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit}
.cl.alert{border-color:rgba(255,91,91,.55)}.cl.warn{border-color:rgba(255,184,0,.5)}
.cl .nm{font-weight:900;font-size:16px}.cl .sub{font-size:12.5px;color:var(--muted)}
.cl .sc{font-size:22px;font-weight:900;text-align:center;line-height:1}.cl .sc small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.dots{display:flex;gap:3px;direction:ltr;margin-top:6px}.dots i{width:12px;height:12px;border-radius:3px;background:#222;display:block}
.dots i.g{background:var(--green)}.dots i.y{background:var(--gold)}.dots i.r{background:var(--red)}
.sub-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px}
.day .dh{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wds{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.wds button{border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:12.5px;background:var(--surface2)}
.wds button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:start;background:var(--surface2);border-radius:14px;padding:8px;margin-bottom:8px}
.it .th{width:64px;height:40px;background:#fff;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888}
.it .th img{width:100%;height:100%;object-fit:contain}
.it .f4{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.it .input{padding:6px 8px;font-size:13.5px}
.it .ctl{display:flex;flex-direction:column;gap:4px}
.it .ctl button{width:30px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.savebar{position:sticky;bottom:calc(10px + var(--safe-bottom));display:flex;gap:8px;z-index:10;margin-top:10px}
.savebar .btn{flex:1;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.exl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.exc .pp{display:grid;grid-template-columns:1fr 1fr;background:#fff;aspect-ratio:2/1}
.exc .pp div{display:flex;align-items:center;justify-content:center;color:#999;font-size:11px;overflow:hidden;border-left:1px solid #eee}
.exc .pp img{width:100%;height:100%;object-fit:contain}
.exc .b{padding:8px 10px}.exc .b b{display:block;font-size:14.5px}.exc .b small{color:var(--gold);font-size:11px;direction:ltr;display:block;text-align:right}
.exc .flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pick{display:grid;gap:6px;max-height:60vh;overflow:auto;margin-top:10px}
.pick button{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;text-align:right;background:var(--surface2);border-radius:12px;padding:6px}
.pick .th{width:70px;height:35px;background:#fff;border-radius:6px;overflow:hidden}.pick .th img{width:100%;height:100%;object-fit:contain}
.upl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upl .box{background:var(--surface2);border:1px dashed var(--line);border-radius:14px;padding:8px;text-align:center}
.upl .box .pv{background:#fff;aspect-ratio:2/1;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;margin-bottom:6px;overflow:hidden}
.upl .box .pv img{width:100%;height:100%;object-fit:contain}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}table.t th{color:var(--muted)}
.meal-ed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.upl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="spinner"></div></div>
<script src="../assets/core.js?v=1"></script>
<script src="../assets/admin.js?v=2"></script>
</body>
</html>
